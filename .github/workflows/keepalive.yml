name: keep-database-awake
# Free Supabase projects pause after 7 idle days; this pings the app database every 3 days.
on:
  schedule:
    - cron: "23 5 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://yregpsppdlqdtictwofo.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_RJgjIlr9zRyNZBpuBLjG6w_e4B5zoKp" \
            -H "Content-Type: application/json" -d '{}'
